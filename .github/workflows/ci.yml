name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: deno lint --config supabase/functions/deno.json supabase/functions
      - run: deno check --config supabase/functions/deno.json --node-modules-dir=auto supabase/functions/_shared/cors.ts supabase/functions/delete-account/index.ts supabase/functions/deregister-device/index.ts supabase/functions/dispatch-reminders/index.ts supabase/functions/occurrence-action/index.ts
      - run: npm run format:check
      - run: npm run export:web
